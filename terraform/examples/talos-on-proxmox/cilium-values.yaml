# Cilium Network Configuration

# IPAM
ipam:
  mode: kubernetes

k8s:
  requireIPv4PodCIDR: true

# kube-proxy replacement
kubeProxyReplacement: true

# Native routing (no overlay)
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"
enableIPv4Masquerade: true

# Security Context Configuration
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# CGroup Configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Kubernetes Service Configuration (overridden)
k8sServiceHost: localhost
k8sServicePort: 7445

# Gateway API Configuration
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

# Encryption settings
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# Authentication / mTLS (SPIRE)
authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        namespace: kube-system
        existingNamespace: true
        server:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        agent:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

# L2 Announcements
l2announcements:
  enabled: true

# Prometheus metrics (core Cilium)
prometheus:
  enabled: true
  metricsService: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Grafana dashboards (Cilium)
dashboards:
  enabled: true

# Envoy (L7 / Gateway API) metrics
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
# Operator metrics
operator:
  dashboards:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
# Hubble configuration (merged)
hubble:
  enabled: true
  ui:
    enabled: true

  relay:
    enabled: true
    prometheus:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
  metrics:
    dashboards:
      enabled: true
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    enableOpenMetrics: true
