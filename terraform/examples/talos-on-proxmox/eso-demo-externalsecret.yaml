# Pulls the one harmless value `scripts/openbao.sh demo-seed` writes, with
# no password manager or real credentials involved - so this example works
# end to end for anyone who clones it. Watch this materialize with:
#   kubectl get secret openbao-demo -o jsonpath='{.data.hello}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-demo
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-demo
  data:
    - secretKey: hello
      remoteRef:
        key: demo/hello
        property: hello
