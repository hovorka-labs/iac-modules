# Cluster-scoped so any namespace's ExternalSecret can reference it - e.g.
# ArgoCD's own repo-credential Secret in a real deployment (not shown in
# this public example - see the blog post for that wiring). "vault" is the
# correct provider type here too: OpenBao exposes the same API Vault does,
# and ESO's vault provider talks to either unchanged.
#
# role/mountPath here must match what `scripts/openbao.sh configure` sets
# up on the OpenBao side. serviceAccountRef assumes the external-secrets
# chart's controller ServiceAccount resolves to "external-secrets" in the
# "external-secrets" namespace (Helm's fullname helper, since the release
# name already matches the chart name) - confirm this against the actual
# chart on first apply.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
